name: Daily Scrape

on:
  schedule:
    - cron: '0 3 * * *'   # 3am UTC daily
  workflow_dispatch: {}    # lets you trigger manually too

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        run: npx --yes --package @brightdata/cli brightdata scraper run c_mt5evkhh7xjyn2fi0 https://www.instahyre.com/search --pretty > jobs.json

      - name: Update database
        run: python pipeline.py

      - name: Commit updated db
        run: |
          git config user.name "indiser"
          git config user.email "banerjeerana74@gmail.com"
          git add jobs.db
          git commit -m "Daily scrape update" || echo "No changes"
          git push
